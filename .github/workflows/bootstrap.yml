name: Bootstrap

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  release:
    types:
      - created

jobs:
  bootstrap:
    strategy:
      # A failure on one OS should not cancel, and so hide, the results on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ["9.6.7", "9.8.4", "9.10.3", "9.12.4", "9.14.1"]
        include:
          # macos-15 rather than macos-latest until actions/runner-images#14940
          # is fixed; see #12465.
          - os: macos-15
            ghc: "9.12.4"
    name: Bootstrap ${{ matrix.os }} ghc-${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Work around XDG directories existence (haskell-actions/setup#62)
        if: ${{ runner.os == 'macOS' }}
        run: |
          rm -rf ~/.config/cabal
          rm -rf ~/.cache/cabal

      - uses: actions/checkout@v7

      # runner.os isn't sufficient for binary compatible caches
      - name: Get runner OS/version for cache keys
        id: get-osver
        run: echo "osver=$ImageOS" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        name: Cache the downloads
        id: bootstrap-cache
        with:
          path: "/home/runner/work/cabal/cabal/_build"
          # Hash the .cabal files of the local packages into the key too:
          # the bootstrap plans only reference local packages by name, so
          # without this the caches of branches with different local package
          # versions (e.g. master vs a release branch) collide and a stale
          # _build/packages.conf gets restored. See #12311.
          key: bootstrap-${{ steps.get-osver.outputs.osver }}-${{ matrix.ghc }}-${{ hashFiles(format('bootstrap/linux-{0}.json', matrix.ghc), 'Cabal/Cabal.cabal', 'Cabal-syntax/Cabal-syntax.cabal', 'Cabal-hooks/Cabal-hooks.cabal', 'hooks-exe/hooks-exe.cabal', 'cabal-install-solver/cabal-install-solver.cabal', 'cabal-install/cabal-install.cabal') }}-${{ github.sha }}
          restore-keys: bootstrap-${{ steps.get-osver.outputs.osver }}-${{ matrix.ghc }}-${{ hashFiles(format('bootstrap/linux-{0}.json', matrix.ghc), 'Cabal/Cabal.cabal', 'Cabal-syntax/Cabal-syntax.cabal', 'Cabal-hooks/Cabal-hooks.cabal', 'hooks-exe/hooks-exe.cabal', 'cabal-install-solver/cabal-install-solver.cabal', 'cabal-install/cabal-install.cabal') }}-

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: bootstrap.py
        run: |
          GHC_VERSION=${{ matrix.ghc }}
          # Fetch the bootstrap sources (we use linux dependencies also on macos)
          python3 bootstrap/bootstrap.py -d bootstrap/linux-$GHC_VERSION.json fetch

          # Bootstrap using the bootstrap sources
          python3 bootstrap/bootstrap.py --bootstrap-sources bootstrap-sources.tar.gz

      - name: Smoke test
        run: |
          _build/bin/cabal --version

      - uses: actions/upload-artifact@v7
        with:
          name: cabal-${{ matrix.os }}-${{ matrix.ghc }}-bootstrapped
          path: _build/artifacts/*

  bootstrap-mhs:
    name: Bootstrap ubuntu-latest mhs-0.16.12.0
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Get runner OS/version for cache keys
        id: get-osver
        run: echo "osver=$ImageOS" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        name: Restore MicroHs toolchain and packages
        id: cache-mhs-toolchain
        with:
          path: ~/.mcabal
          key: mhs-toolchain-${{ steps.get-osver.outputs.osver }}-0.16.12.0-${{ hashFiles('bootstrap/mhs/microhs-full.patch', 'mhs-compat-shims/**') }}
          restore-keys: |
            mhs-toolchain-${{ steps.get-osver.outputs.osver }}-0.16.12.0-

      - uses: actions/cache/restore@v6
        name: Restore MicroHs stage checkpoints
        id: cache-mhs-checkpoints
        with:
          path: _build/mhs-cache
          key: mhs-cache-${{ steps.get-osver.outputs.osver }}-0.16.12.0-${{ hashFiles('bootstrap/mhs/**', 'mhs-compat-shims/**', 'Cabal-syntax/src/**', 'Cabal/src/**', 'hooks-exe/**', 'cabal-install-solver/src/**', 'cabal-install/src/**', 'cabal-install/main/**') }}

      - name: Build MicroHs 0.16.12.0 toolchain and packages
        run: bash bootstrap/mhs/build-cabal-mhs.sh toolchain

      - uses: actions/cache/save@v6
        name: Save MicroHs toolchain and packages
        if: always() && steps.cache-mhs-toolchain.outputs.cache-hit != 'true'
        with:
          path: ~/.mcabal
          key: ${{ steps.cache-mhs-toolchain.outputs.cache-primary-key }}

      - name: Bootstrap cabal-install with MicroHs
        run: bash bootstrap/mhs/build-cabal-mhs.sh build

      - uses: actions/cache/save@v6
        name: Save MicroHs stage checkpoints
        if: always() && steps.cache-mhs-checkpoints.outputs.cache-hit != 'true'
        with:
          path: _build/mhs-cache
          key: ${{ steps.cache-mhs-checkpoints.outputs.cache-primary-key }}

      - name: Smoke test MicroHs-built cabal
        run: bash bootstrap/mhs/build-cabal-mhs.sh test

      - uses: actions/upload-artifact@v7
        with:
          name: cabal-ubuntu-latest-mhs-0.16.12.0-bootstrapped
          path: _build/artifacts/*

  # We use this job as a summary of the workflow
  # It will fail if any of the previous jobs does it
  # This way we can use it exclusively in branch protection rules
  # and abstract away the concrete jobs of the workflow, including their names
  bootstrap-post-job:
    if: always()
    name: Bootstrap post job
    runs-on: ubuntu-latest
    # IMPORTANT! Any job added to the workflow should be added here too
    needs: [bootstrap, bootstrap-mhs]

    steps:
      - run: |
          echo "jobs info: ${{ toJSON(needs) }}"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
